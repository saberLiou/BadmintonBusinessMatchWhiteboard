  <rect x="25" y="31" width="22" height="7" rx="3.5" fill="#cbd5e1"/>
  <rect x="65" y="31" width="22" height="7" rx="3.5" fill="#cbd5e1"/>
  <path d="M56 28v54M22 46h68" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round"/>
